<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Resume Matcher</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 40px;
            background-color: #f8f9fa;
        }
        h2, h3, h4 {
            color: #333;
        }
        form {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.05);
            margin-bottom: 30px;
        }
        textarea, input[type="file"], input[type="submit"] {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 15px;
            border-radius: 6px;
            border: 1px solid #ccc;
            box-sizing: border-box;
            font-size: 15px;
        }
        input[type="submit"] {
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        input[type="submit"]:hover {
            background-color: #0056b3;
        }
        .resume-box {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #e0e0e0;
            margin-bottom: 30px;
            box-shadow: 0px 3px 8px rgba(0, 0, 0, 0.03);
        }
        .resume-box h4 {
            margin-top: 0;
            color: #007BFF;
        }
        .resume-text {
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            white-space: pre-wrap;
            line-height: 1.7;
            color: #343a40;
        }
        .highlighted {
            background-color: #e6f4ea;
            color: #2f684e;
            padding: 2px 8px;
            margin: 0 2px;
            border-radius: 20px;
            font-weight: 500;
            transition: background-color 0.3s ease;
            cursor: help;
        }
        .highlighted:hover::after {
            content: "Matched Keyword";
            position: absolute;
            background-color: #2f684e;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            margin-top: -30px;
            margin-left: 10px;
            font-size: 12px;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <h2>Resume Matcher</h2>
    <form method="POST" action="/matcher" enctype="multipart/form-data">
        <label for="job_description">Enter Job Description:</label>
        <textarea name="job_description" rows="6" required placeholder="Enter job requirements here..."></textarea>

        <label for="resumes">Upload Resumes (PDF, DOCX, or TXT):</label>
        <input type="file" name="resumes" multiple required>

        <input type="submit" value="Match Resumes">
    </form>

    {% if message %}
        <h3>{{ message }}</h3>
    {% endif %}

    {% if matched_info %}
        {% for item in matched_info %}
            <div class="resume-box">
                <h4>{{ item.filename }} — Similarity Score: {{ item.score }}</h4>
                <div class="resume-text">
                    {{ item.highlighted_resume | safe }}
                </div>
            </div>
        {% endfor %}
    {% endif %}

</body>
</html>
